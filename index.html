<script>
  // 禁用右鍵
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 禁用快捷鍵 (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S)
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>

    <meta charset="UTF-8">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"Press Start 2P"', 'monospace'],
                        gothic: ['"DotGothic16"', 'sans-serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif']
                    }
                }

    </script>
    <style>
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 5px 100%;
            pointer-events: none;
        }
        .pixel-box-32 {
            border: 4px solid #3b0764;
            box-shadow: inset -2px -2px 0px #1e1b4b, inset 2px 2px 0px #c084fc, 4px 4px 0px #090514;
            background: #1e1b4b;
        }
        .pixel-btn-32 {
            border: 3px solid #2e1065;
            box-shadow: inset -2px -2px 0px #4c1d95, inset 2px 2px 0px #ddd6fe, 3px 3px 0px #090514;
            transition: all 0.1s ease;
        }
        .pixel-btn-32:hover {
            transform: translate(-1px, -1px);
            filter: brightness(1.15);
        }
        .pixel-btn-32:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #090514;
        }
        .leaflet-popup-content-wrapper {
            background: #2e1065 !important;
            color: #fef08a !important;
            border: 3px solid #f59e0b !important;
            box-shadow: 4px 4px 0px #090514 !important;
            border-radius: 0px !important;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .leaflet-popup-tip {
            background: #f59e0b !important;
        }
        .dark-map-filter .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(200deg) brightness(85%) contrast(125%);
        }
        @keyframes pixelPulse {
            0% { transform: scale(1); box-shadow: 0 0 0px #f59e0b; }
            50% { transform: scale(1.1); box-shadow: 0 0 12px #f59e0b; }
            100% { transform: scale(1); box-shadow: 0 0 0px #f59e0b; }
        }
        .marker-pulse {
            animation: pixelPulse 2s infinite ease-in-out;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1b4b; border: 2px solid #3b0764; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border: 2px solid #3b0764; }
    </style>
</head>

            <div class="bg-gradient-to-r from-purple-950 to-slate-900 text-amber-300 px-4 py-3 border-b-2 border-purple-900 flex items-center justify-between">

    <!-- 自訂餐廳 Modal 彈窗 -->

                <button onclick="saveCustomRestaurant()" class="pixel-btn-32 bg-amber-500 text-slate-950 font-bold px-4 py-2 font-pixel text-xs">確定新增</button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const LOCATIONIQ_TOKEN = 'pk.fbe6fd6cddba735877418e495a8a3356';

        let map;
        let userMarker = null;
        let userCircle = null;
        let restaurantMarkers = [];
        let allRestaurants = [];
        let customRestaurants = [];
        let currentFilter = 'all';
        let userLat = 22.3046;
        let userLng = 114.1706;
        let isDarkMode = true;
        let isAddMode = false;
        let selectedLat = null;
        let selectedLng = null;

        const hkFamousRestaurants = [
            { id: 1, name: "澳洲牛奶公司 (Australia Dairy Company)", lat: 22.3046, lon: 114.1706, type: "cha_chaan_teng", cuisine: "經典茶記", address: "佐敦白加士街47號地下", rating: "4.5" },
            { id: 2, name: "蘭芳園 (Lan Fong Yuen)", lat: 22.2826, lon: 114.1541, type: "cha_chaan_teng", cuisine: "絲襪奶茶", address: "中環結志街2號", rating: "4" },
            { id: 3, name: "科記咖啡餐廳 (For Kee)", lat: 22.2852, lon: 114.1482, type: "cha_chaan_teng", cuisine: "金牌豬排", address: "上環荷李活道200號地下", rating: "4" },
            { id: 4, name: "佳佳甜品 (Kai Kai Dessert)", lat: 22.3065, lon: 114.1710, type: "dessert", cuisine: "米芝蓮甜品", address: "佐敦寧波街29號地舖", rating: "4.5" },
            { id: 5, name: "日昇小食", lat: 22.3194, lon: 114.1873, type: "small_shop", cuisine: "著名韭菜餅小店", address: "九龍土瓜灣馬頭圍道428 號C 舖地下", rating: "4.5" },
            { id: 6, name: "By The O Studio", lat: 22.3179, lon: 114.1903, type: "cafe", cuisine: "打卡Cafe", address: "土瓜灣長寧街58號定安大廈地下45號舖", rating: "3.5" },
            { id: 7, name: "莆源冰室 (Po Yuen Cafe)", lat: 22.334588, lon: 114.194909, type: "cafe", cuisine: "醫院飯", address: "新蒲崗仁愛街26號", rating: "3" }
        ];

        function initMap() {
            try {
                if (map) return;

                map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 19);

                const locationIQLayer = L.tileLayer(`https://{s}-tiles.locationiq.com/v3/streets/r/{z}/{x}/{y}.png?key=${LOCATIONIQ_TOKEN}`, {
                    maxZoom: 19,
                    subdomains: ['a', 'b', 'c'],
                    attribution: '&copy; LocationIQ &copy; OpenStreetMap'
                });

                const fallbackLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                });

                locationIQLayer.addTo(map);
                locationIQLayer.on('tileerror', function() {
                    map.removeLayer(locationIQLayer);
                    fallbackLayer.addTo(map);
                });

                L.control.zoom({ position: 'bottomright' }).addTo(map);

                map.on('click', function(e) {
                    if (isAddMode) {
                        selectedLat = e.latlng.lat;
                        selectedLng = e.latlng.lng;
                        document.getElementById('addModal').classList.remove('hidden');
                    }
                });

                loadSavedCustomRestaurants();
                updateUserMarkerAndCircle();
                loadRealHKRestaurants();
                triggerGPS();

                setTimeout(() => {
                    map.invalidateSize();
                }, 200);

            } catch (e) {
                console.error("地圖初始化錯誤: ", e);
            }
        }

        function toggleAddMode() {
            isAddMode = !isAddMode;
            const btn = document.getElementById('addModeBtn');
            if (isAddMode) {
                btn.className = 'pixel-btn-32 bg-rose-600 text-white font-bold px-3 py-1.5 text-xs font-pixel rounded-none animate-pulse';
                btn.innerText = '🎯 請點擊地圖位置';
                setDialogue("【新增模式】請直接在地圖上點擊你想要新增餐廳的位置！");
            } else {
                btn.className = 'pixel-btn-32 bg-amber-500 text-slate-950 font-bold px-3 py-1.5 text-xs font-pixel rounded-none';
                btn.innerText = '➕ 點擊地圖加餐廳';
                setDialogue("已退出新增模式。");
            }
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function saveCustomRestaurant() {
            const name = document.getElementById('custName').value.trim() || "神秘隱藏美食";
            const type = document.getElementById('custType').value;
            const rating = document.getElementById('custRating').value || "3.5";
            const address = document.getElementById('custAddress').value.trim() || "私人秘密據點";

            const newRestaurant = {
                id: 'cust_' + Date.now(),
                name: name,
                lat: selectedLat,
                lon: selectedLng,
                type: type,
                cuisine: "自訂私房菜",
                address: address,
                rating: rating,
                isCustom: true,
                favorited: true
            };

            customRestaurants.push(newRestaurant);
            localStorage.setItem('my_custom_restaurants_v5', JSON.stringify(customRestaurants));

            closeAddModal();
            toggleAddMode();
            loadRealHKRestaurants();
            setDialogue(`成功新增私房美食寶箱：「${name}」！`);
        }

        function loadSavedCustomRestaurants() {
            const saved = localStorage.getItem('my_custom_restaurants_v5');
            if (saved) {
                try {
                    customRestaurants = JSON.parse(saved);
                } catch (e) { customRestaurants = []; }
            }
        }

        function deleteCustomRestaurant(id) {
            customRestaurants = customRestaurants.filter(r => r.id !== id);
            localStorage.setItem('my_custom_restaurants_v5', JSON.stringify(customRestaurants));
            loadRealHKRestaurants();
            setDialogue("已成功移除該自訂餐廳據點。");
        }

        function toggleMapTheme() {
            isDarkMode = !isDarkMode;
            const mapContainer = document.getElementById('map');
            const btn = document.getElementById('themeBtn');

            if (isDarkMode) {
                mapContainer.classList.add('dark-map-filter');
                btn.innerText = '🌌 Dark';
                btn.className = 'pixel-btn-32 bg-purple-700 text-white px-3 py-1.5 text-xs font-pixel rounded-none';
            } else {
                mapContainer.classList.remove('dark-map-filter');
                btn.innerText = '☀️ Light';
                btn.className = 'pixel-btn-32 bg-amber-500 text-slate-950 px-3 py-1.5 text-xs font-pixel rounded-none';
            }
        }

        function triggerGPS() {
            const gpsText = document.getElementById('gpsText');
            gpsText.innerText = 'GPS 定位中...';

            if ("geolocation" in navigator) {
                const gpsTimeout = setTimeout(() => {
                    gpsText.innerText = '100M 預設座標';
                }, 3000);

                navigator.geolocation.getCurrentPosition(position => {
                    clearTimeout(gpsTimeout);
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    
                    map.setView([userLat, userLng], 19);
                    updateUserMarkerAndCircle();
                    gpsText.innerText = 'GPS 100M 鎖定';
                    setTimeout(() => map.invalidateSize(), 100);
                }, error => {
                    clearTimeout(gpsTimeout);
                    gpsText.innerText = '100M 預設座標';
                }, { enableHighAccuracy: true, timeout: 3000 });
            }
        }

        function updateUserMarkerAndCircle() {
            if (userMarker) map.removeLayer(userMarker);
            if (userCircle) map.removeLayer(userCircle);

            userCircle = L.circle([userLat, userLng], {
                color: '#f59e0b',
                fillColor: '#fbbf24',
                fillOpacity: 0.15,
                radius: 100,
                weight: 2,
                dashArray: '6, 6'
            }).addTo(map);

            const heroIcon = L.divIcon({
                className: 'custom-hero-icon',
                html: `
                    <div class="marker-pulse" style="background: linear-gradient(135deg, #f43f5e, #be123c); width: 32px; height: 32px; border: 3px solid #fef08a; box-shadow: 0 0 10px #f43f5e; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: bold;">
                        🧝‍♂️
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            userMarker = L.marker([userLat, userLng], { icon: heroIcon }).addTo(map)
                .bindPopup('<b style="color:#f59e0b;">⚔️ 勇者冒險據點 (雷達中心)</b>');
        }

        function loadRealHKRestaurants() {
            restaurantMarkers.forEach(m => map.removeLayer(m));
            restaurantMarkers = [];
            allRestaurants = [...customRestaurants];

            hkFamousRestaurants.forEach(item => {
                if (!allRestaurants.some(r => r.name === item.name)) {
                    allRestaurants.push({ ...item, favorited: false });
                }
            });

            allRestaurants.forEach(item => {
                const isCust = item.isCustom;
                const iconHtml = `
                    <div class="marker-pulse" style="background: ${isCust ? 'linear-gradient(135deg, #10b981, #047857)' : 'linear-gradient(135deg, #fbbf24, #d97706)'}; border: 3px solid #2e1065; box-shadow: 3px 3px 0px #090514; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; border-radius: 6px;">
                        ${isCust ? '💎' : '🍜'}
                    </div>
                `;
                const customIcon = L.divIcon({
                    className: 'custom-food-marker',
                    html: iconHtml,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([item.lat, item.lon], { icon: customIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="font-family:'Noto Sans TC',sans-serif; min-width:190px;">
                        <b style="font-size:15px; color:#fef08a;">${item.name} ${isCust ? '✏️' : ''}</b><br>
                        <span style="font-size:12px; color:#cbd5e1;">🌟 評分: ${item.rating} | ${item.cuisine}</span><br>
                        <span style="font-size:11px; color:#94a3b8;">📍 ${item.address}</span><br>
                        <div style="margin-top:8px; display:flex; gap:4px;">
                            <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lon}" target="_blank" style="background: linear-gradient(to right, #e11d48, #be123c); color:white; padding:4px 8px; font-size:11px; text-decoration:none; font-weight:bold; border-radius:2px;">🚀 導航</a>
                            <a href="https://www.openrice.com/zh/hongkong/restaurants?what=${encodeURIComponent(item.name.split(' ')[0])}" target="_blank" style="background: linear-gradient(to right, #ea580c, #c2410c); color:white; padding:4px 8px; font-size:11px; text-decoration:none; font-weight:bold; border-radius:2px;">📖 OpenRice</a>
                        </div>
                    </div>
                `);

                restaurantMarkers.push(marker);
            });

            renderInventory();
        }

        // 🚀 使用 LocationIQ 官方搜尋 API 進行視野掃描
        async function searchRestaurantsInBounds() {
            setDialogue("法師輕鬆咁施展美食雷達探測術....");
            const bounds = map.getBounds();
            const south = bounds.getSouth();
            const west = bounds.getWest();
            const north = bounds.getNorth();
            const east = bounds.getEast();

            // LocationIQ viewbox 格式: min_lon,max_lat,max_lon,min_lat (即 west,north,east,south)
            const viewbox = `${west},${north},${east},${south}`;

            try {
                // 同時搜尋 restaurant 與 cafe
                const urlRest = `https://us1.locationiq.com/v1/search.php?key=${LOCATIONIQ_TOKEN}&q=restaurant&format=json&viewbox=${viewbox}&bounded=1&addressdetails=1`;
                const urlCafe = `https://us1.locationiq.com/v1/search.php?key=${LOCATIONIQ_TOKEN}&q=cafe&format=json&viewbox=${viewbox}&bounded=1&addressdetails=1`;

                const [resRest, resCafe] = await Promise.all([
                    fetch(urlRest),
                    fetch(urlCafe)
                ]);

                const dataRest = await resRest.json();
                const dataCafe = await resCafe.json();

                const combined = [
                    ...(Array.isArray(dataRest) ? dataRest : []),
                    ...(Array.isArray(dataCafe) ? dataCafe : [])
                ];

                if (combined.length > 0) {
                    parseLocationIQRestaurants(combined);
                } else {
                    setDialogue("此視野未偵測到新餐館！");
                }
            } catch (e) {
                console.error(e);
                setDialogue("官方雷達連線逾時或發生錯誤！");
            }
        }

        function parseLocationIQRestaurants(elements) {
            let addedCount = 0;
            elements.forEach((el, index) => {
                const lat = parseFloat(el.lat);
                const lon = parseFloat(el.lon);
                if (!lat || !lon) return;

                const name = el.display_name ? el.display_name.split(',')[0] : `視野餐館 #${index + 1}`;
                if (allRestaurants.some(r => r.name === name)) return;

                const address = (el.address && (el.address.road || el.address.neighbourhood))
                    ? `${el.address.neighbourhood || ''} ${el.address.road || ''}`.trim()
                    : (el.display_name || '香港街頭');

                // 智慧分類對應四大分類
                let type = 'small_shop';
                const lowerName = name.toLowerCase();
                if (lowerName.includes('cafe') || lowerName.includes('咖啡') || lowerName.includes('coffee')) {
                    type = 'cafe';
                } else if (lowerName.includes('甜品') || lowerName.includes('dessert') || lowerName.includes('糖水')) {
                    type = 'dessert';
                } else if (lowerName.includes('茶餐廳') || lowerName.includes('冰室') || lowerName.includes('cha chaan')) {
                    type = 'cha_chaan_teng';
                }

                const restaurant = {
                    id: 'liq_' + (el.place_id || Math.random()),
                    name: name,
                    lat: lat,
                    lon: lon,
                    type: type,
                    cuisine: type === 'cafe' ? 'CAFE 咖啡廳' : (type === 'dessert' ? '甜品專門店' : (type === 'cha_chaan_teng' ? '港式茶記' : '地道小店')),
                    address: address,
                    rating: (4.1 + Math.random() * 0.8).toFixed(1),
                    favorited: false
                };

                allRestaurants.push(restaurant);
                addedCount++;

                const iconHtml = `
                    <div class="marker-pulse" style="background: linear-gradient(135deg, #a855f7, #7e22ce); border: 3px solid #fef08a; box-shadow: 3px 3px 0px #090514; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; border-radius: 6px;">
                        🍜
                    </div>
                `;
                const customIcon = L.divIcon({ className: 'custom-food-marker', html: iconHtml, iconSize: [32, 32], iconAnchor: [16, 16] });
                const marker = L.marker([lat, lon], { icon: customIcon }).addTo(map);
                marker.bindPopup(`
                    <div style="font-family:'Noto Sans TC',sans-serif; min-width:190px;">
                        <b style="font-size:15px; color:#fef08a;">${name}</b><br>
                        <span style="font-size:12px; color:#cbd5e1;">🌟 評分: ${restaurant.rating} | ${restaurant.cuisine}</span><br>
                        <span style="font-size:11px; color:#94a3b8;">📍 ${address}</span><br>
                        <div style="margin-top:8px; display:flex; gap:4px;">
                            <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" style="background: linear-gradient(to right, #e11d48, #be123c); color:white; padding:4px 8px; font-size:11px; text-decoration:none; font-weight:bold; border-radius:2px;">🚀 導航</a>
                            <a href="https://www.openrice.com/zh/hongkong/restaurants?what=${encodeURIComponent(name.split(' ')[0])}" target="_blank" style="background: linear-gradient(to right, #ea580c, #c2410c); color:white; padding:4px 8px; font-size:11px; text-decoration:none; font-weight:bold; border-radius:2px;">📖 OpenRice</a>
                        </div>
                    </div>
                `);
                restaurantMarkers.push(marker);
            });

            renderInventory();
            setDialogue(`雷達掃描完畢！成功捕獲 ${addedCount} 間新餐館！`);
        }

        function renderInventory() {
            const listEl = document.getElementById('restaurantList');
            const filtered = allRestaurants.filter(r => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'favorite') return r.favorited;
                return r.type === currentFilter;
            });

            document.getElementById('inventoryCount').innerText = `${filtered.length} 筆`;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-purple-300 font-sans text-xs">沒有符合此分類的美食項目</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(r => `
                <div class="pixel-box-32 bg-slate-900/90 p-3 hover:border-amber-400 transition-all border border-purple-800 relative">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl">${r.isCustom ? '💎' : '🍲'}</span>
                            <div>
                                <h3 class="font-bold text-sm text-amber-300 flex items-center gap-1">
                                    ${r.name}
                                    ${r.isCustom ? '<span class="text-[9px] bg-emerald-600 text-white px-1 py-0.5 font-pixel">自訂</span>' : ''}
                                </h3>
                                <p class="text-[11px] text-purple-200">🌟 ${r.rating} | ${r.address}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            ${r.isCustom ? `<button onclick="deleteCustomRestaurant('${r.id}')" class="text-xs bg-rose-900 text-rose-200 px-1.5 py-0.5 hover:bg-rose-700">🗑️</button>` : ''}
                            <button onclick="toggleFavorite('${r.id}')" class="text-lg focus:outline-none">
                                ${r.favorited ? '❤️' : '🤍'}
                            </button>
                        </div>
                    </div>
                    <div class="mt-2 pt-2 border-t border-purple-900/60 flex items-center justify-between text-xs">
                        <span class="text-[10px] bg-purple-950 text-amber-400 px-2 py-0.5 border border-purple-700 font-pixel">${r.cuisine || r.type}</span>
                        <div class="space-x-1">
                            <button onclick="panToRestaurant(${r.lat}, ${r.lon})" class="pixel-btn-32 bg-amber-500 text-slate-950 font-bold px-2.5 py-1 font-pixel text-[10px]">👁️ 檢視</button>
                            <a href="https://www.openrice.com/zh/hongkong/restaurants?what=${encodeURIComponent(r.name.split(' ')[0])}" target="_blank" class="pixel-btn-32 bg-orange-600 text-white px-2.5 py-1 font-pixel text-[10px] inline-block">📖 OpenRice</a>
                            <a href="https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}" target="_blank" class="pixel-btn-32 bg-emerald-600 text-white px-2.5 py-1 font-pixel text-[10px] inline-block">🚀 導航</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-amber-400', 'text-slate-950', 'font-bold');
                btn.classList.add('bg-purple-900', 'text-purple-200');
            });
            event.target.classList.remove('bg-purple-900', 'text-purple-200');
            event.target.classList.add('bg-amber-400', 'text-slate-950', 'font-bold');
            renderInventory();
        }

        function toggleFavorite(id) {
            const item = allRestaurants.find(r => r.id === id || r.id == id);
            if (item) {
                item.favorited = !item.favorited;
                renderInventory();
            }
        }

        function panToRestaurant(lat, lon) {
            map.setView([lat, lon], 19);
        }

        function setDialogue(text) {
            document.getElementById('dialogueText').innerText = text;
        }

        window.onload = initMap;
    </script>
</body>
</html>
