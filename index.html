<script>
  // 禁用右鍵
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 禁用快捷鍵 (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S)
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>

    <style>
        /* 80s-90s Cel Anime Canvas Overlay Effects */
        .cel-shading {
            box-shadow: 0 0 0 4px #000, 4px 4px 0 4px #1e1b4b, 8px 8px 18px rgba(0,0,0,0.35);
        }
        .anime-panel {
            background: linear-gradient(135deg, #ffffff 0%, #fff5f8 100%);
            border: 3.5px solid #000;
            box-shadow: 4px 4px 0px #000;
            border-radius: 12px;
        }

        /* Vintage Anime Buttons with Halftone/Speedlines */
        .anime-btn {
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            font-weight: 900;
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s ease;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        .anime-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
            filter: brightness(1.08);
        }
        .anime-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        /* Speedlines / Action Rays Background Banner */
        .speedlines {
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255, 255, 255, 0.25) 0deg 10deg,
                rgba(255, 255, 255, 0) 10deg 20deg
            );
        }
        
        /* Anime Aura Animations for Hero Mascot */
        @keyframes auraGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 4px #facc15) drop-shadow(0 0 10px #f43f5e); }
            50% { transform: scale(1.12) rotate(3deg); filter: drop-shadow(0 0 12px #38bdf8) drop-shadow(0 0 20px #fb7185); }
            100% { transform: scale(1); filter: drop-shadow(0 0 4px #facc15) drop-shadow(0 0 10px #f43f5e); }
        }
        .hero-aura {
            animation: auraGlow 1.8s infinite ease-in-out;
        }

        @keyframes starburstPulse {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .starburst {
            animation: starburstPulse 3s infinite ease-in-out;
        }

        /* Leaflet Popup Customization */
        .leaflet-popup-content-wrapper {
            background: #ffffff !important;
            color: #000 !important;
            border: 3.5px solid #000 !important;
            box-shadow: 5px 5px 0px #000 !important;
            border-radius: 12px !important;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .leaflet-popup-tip {
            background: #000 !important;
        }
        
        /* Night Mode Filter for Anime Cel Map */
        .anime-night-filter .leaflet-tile-pane {
            filter: invert(90%) hue-rotate(220deg) brightness(85%) contrast(140%);
        }

        /* Custom Routing Line Animation Glow */
        @keyframes lineGlow {
            0% { stroke: #f43f5e; }
            50% { stroke: #38bdf8; }
            100% { stroke: #f43f5e; }
        }

        /* Hide default Leaflet Routing Machine control panel box */
        .leaflet-routing-container {
            display: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #ffe4e6; border-left: 3px solid #000; }
        ::-webkit-scrollbar-thumb { background: #f43f5e; border: 2px solid #000; border-radius: 6px; }

    <script>
        const LOCATIONIQ_TOKEN = 'pk.fbe6fd6cddba735877418e495a8a3356';

        let map;
        let userMarker = null;
        let userCircle = null;
        let restaurantMarkers = [];
        let markerMap = {}; // 對照表：用 restaurant.id 快速尋找對應的 Leaflet Marker
        let allRestaurants = [];
        let currentFilter = 'all';
        let userLat = 22.3048;
        let userLng = 114.1702;
        let isDarkMode = false;
        let isAddMode = false;
        let selectedLat = null;
        let selectedLng = null;
        let routingControl = null; // 導航控制物件

        function initMap() {
            try {
                if (map) return;

                map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 18);

                const locationIQLayer = L.tileLayer(`https://{s}-tiles.locationiq.com/v3/streets/r/{z}/{x}/{y}.png?key=${LOCATIONIQ_TOKEN}`, {
                    maxZoom: 19,
                    subdomains: ['a', 'b', 'c'],
                    attribution: '&copy; LocationIQ &copy; OpenStreetMap'
                });

                const fallbackLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                });

                locationIQLayer.addTo(map);
                locationIQLayer.on('tileerror', function() {
                    map.removeLayer(locationIQLayer);
                    fallbackLayer.addTo(map);
                });

                L.control.zoom({ position: 'bottomright' }).addTo(map);

                // 手動點擊地圖新增私房美食
                map.on('click', function(e) {
                    if (isAddMode) {
                        selectedLat = e.latlng.lat;
                        selectedLng = e.latlng.lng;
                        document.getElementById('addModal').classList.remove('hidden');
                    }
                });

                loadSavedRestaurants();
                updateUserMarkerAndCircle();
                renderAllMarkersAndInventory();
                triggerGPS();

                setTimeout(() => { map.invalidateSize(); }, 200);

            } catch (e) {
                console.error("地圖初始化錯誤: ", e);
            }
        }

        function toggleAddMode() {
            isAddMode = !isAddMode;
            const btn = document.getElementById('addModeBtn');
            const text = document.getElementById('addBtnText');

            if (isAddMode) {
                btn.className = 'anime-btn bg-rose-500 text-white font-black px-3 py-1.5 text-xs animate-bounce';
                text.innerText = '🎯 請點擊地圖標記位置';
                setDialogue("【新增模式】請直接在地圖上點擊你想記錄的美食位置！");
            } else {
                btn.className = 'anime-btn bg-amber-300 text-black font-black px-3 py-1.5 text-xs';
                text.innerText = '點擊地圖加私房美食';
                setDialogue("已退出新增模式。");
            }
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        // 保存新增餐廳至 LocalStorage
        function saveCustomRestaurant() {
            const name = document.getElementById('custName').value.trim() || "神秘私房美食";
            const status = document.getElementById('custStatus').value;
            const rating = document.getElementById('custRating').value || "3";
            const address = document.getElementById('custAddress').value.trim() || "私房秘密據點";

            const newRestaurant = {
                id: 'toei_spot_' + Date.now(),
                name: name,
                lat: selectedLat,
                lon: selectedLng,
                status: status, // 'uncategorized', 'eaten', 'wishlist', 'favorite'
                address: address,
                rating: rating
            };

            allRestaurants.push(newRestaurant);
            persistRestaurants();

            closeAddModal();
            toggleAddMode();
            renderAllMarkersAndInventory();
            setDialogue(`成功將據點「${name}」收入戰隊庫存！`);
        }

        function loadSavedRestaurants() {
            const saved = localStorage.getItem('toei_user_restaurants');
            if (saved) {
                try {
                    allRestaurants = JSON.parse(saved);
                } catch (e) { allRestaurants = []; }
            } else {
                allRestaurants = [];
            }
        }

        function persistRestaurants() {
            localStorage.setItem('toei_user_restaurants', JSON.stringify(allRestaurants));
        }

        function deleteRestaurant(id) {
            allRestaurants = allRestaurants.filter(r => r.id !== id);
            persistRestaurants();
            renderAllMarkersAndInventory();
            setDialogue("已將該據點移出寶物庫。");
        }

        function updateRestaurantStatus(id, newStatus) {
            const item = allRestaurants.find(r => r.id === id);
            if (item) {
                item.status = newStatus;
                persistRestaurants();
                renderAllMarkersAndInventory();
            }
        }

        function toggleMapTheme() {
            isDarkMode = !isDarkMode;
            const mapContainer = document.getElementById('map');
            const btn = document.getElementById('themeBtn');
            const body = document.getElementById('bodyBg');

            if (isDarkMode) {
                mapContainer.classList.add('anime-night-filter');
                btn.innerText = '☀️ 日間';
                btn.className = 'anime-btn bg-amber-300 text-black px-3 py-1.5 text-xs font-black';
                body.className = "bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 text-white font-anime h-screen flex flex-col overflow-hidden select-none transition-colors duration-500";
                setDialogue("已切換為【夜視模式】！");
            } else {
                mapContainer.classList.remove('anime-night-filter');
                btn.innerText = '🌙 夜視';
                btn.className = 'anime-btn bg-purple-600 text-white px-3 py-1.5 text-xs font-black';
                body.className = "bg-gradient-to-br from-sky-200 via-pink-100 to-amber-100 text-slate-900 font-anime h-screen flex flex-col overflow-hidden select-none transition-colors duration-500";
                setDialogue("已切換為【日間】！");
            }
        }

        // GPS Real-time tracking
        function triggerGPS() {
            const gpsText = document.getElementById('gpsText');
            gpsText.innerText = 'GPS 定位中...';

            if ("geolocation" in navigator) {
                const gpsTimeout = setTimeout(() => {
                    gpsText.innerText = '預設座標';
                }, 3000);

                navigator.geolocation.getCurrentPosition(position => {
                    clearTimeout(gpsTimeout);
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    
                    map.setView([userLat, userLng], 18);
                    updateUserMarkerAndCircle();
                    gpsText.innerText = 'GPS 已鎖定';
                    setTimeout(() => map.invalidateSize(), 100);
                }, error => {
                    clearTimeout(gpsTimeout);
                    gpsText.innerText = '預設座標';
                }, { enableHighAccuracy: true, timeout: 3000 });
            }
        }

        // 100m Radius Indicator & Gourmet Ranger Mascot Avatar
        function updateUserMarkerAndCircle() {
            if (userMarker) map.removeLayer(userMarker);
            if (userCircle) map.removeLayer(userCircle);

            userCircle = L.circle([userLat, userLng], {
                color: '#f43f5e',
                fillColor: '#fb7185',
                fillOpacity: 0.18,
                radius: 100,
                weight: 3.5,
                dashArray: '8, 8'
            }).addTo(map);

            const heroIcon = L.divIcon({
                className: 'custom-hero-icon',
                html: `
                    <div class="hero-aura" style="background: linear-gradient(135deg, #f59e0b, #ef4444); width: 38px; height: 38px; border: 3.5px solid #000; box-shadow: 3px 3px 0px #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;">
                        🧙‍♂️
                    </div>
                `,
                iconSize: [38, 38],
                iconAnchor: [19, 19]
            });

            userMarker = L.marker([userLat, userLng], { icon: heroIcon }).addTo(map)
                .bindPopup('<b style="color:#e11d48; font-size:14px;">⚔️ 美食戰隊隊長據點 (100M 雷達範圍)</b>');
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'uncategorized': return '❓';
                case 'eaten': return '😋';
                case 'wishlist': return '📌';
                case 'favorite': return '💖';
                default: return '📍';
            }
        }

        function getStatusLabel(status) {
            switch(status) {
                case 'uncategorized': return '未分類';
                case 'eaten': return '食過';
                case 'wishlist': return '想去';
                case 'favorite': return '最愛';
                default: return '標記';
            }
        }

        function renderAllMarkersAndInventory() {
            restaurantMarkers.forEach(m => map.removeLayer(m));
            restaurantMarkers = [];
            markerMap = {}; // 清空標籤對照表

            allRestaurants.forEach(item => {
                const iconSymbol = getStatusIcon(item.status);

                const iconHtml = `
                    <div style="background: linear-gradient(135deg, #fbbf24, #f59e0b); border: 3px solid #000; box-shadow: 3px 3px 0px #000; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; border-radius: 10px;">
                        ${iconSymbol}
                    </div>
                `;
                const customIcon = L.divIcon({
                    className: 'custom-food-marker',
                    html: iconHtml,
                    iconSize: [34, 34],
                    iconAnchor: [17, 17]
                });

                const marker = L.marker([item.lat, item.lon], { icon: customIcon }).addTo(map);
                
                // 轉義單引號以防 JS 語法崩潰
                const safeName = item.name.replace(/'/g, "\\'");

                marker.bindPopup(`
                    <div style="font-family:'Noto Sans TC',sans-serif; min-width:210px;">
                        <span style="background:#f43f5e; color:white; font-size:10px; font-weight:bold; padding:2px 8px; border-radius:4px; border:1px solid #000;">${getStatusIcon(item.status)} ${getStatusLabel(item.status)}</span><br>
                        <b style="font-size:15px; color:#000; display:inline-block; margin-top:4px;">${item.name}</b><br>
                        <span style="font-size:12px; color:#475569;">🌟 戰鬥力: <b>${item.rating}</b></span><br>
                        <span style="font-size:11px; color:#64748b;">📍 ${item.address}</span><br>
                        <div style="margin-top:10px; display:flex; gap:6px;">
                            <button onclick="startNavigation(${item.lat}, ${item.lon}, '${safeName}')" style="background: #10b981; color:white; padding:5px 10px; font-size:11px; font-weight:bold; border:2px solid #000; box-shadow:2px 2px 0 #000; border-radius:6px; cursor:pointer;">🚀 導航</button>
                            <a href="https://www.openrice.com/zh/hongkong/restaurants?what=${encodeURIComponent(item.name.split(' ')[0])}" target="_blank" style="background: #f97316; color:white; padding:5px 10px; font-size:11px; text-decoration:none; font-weight:bold; border:2px solid #000; box-shadow:2px 2px 0 #000; border-radius:6px;">📖 OpenRice</a>
                        </div>
                    </div>
                `);

                restaurantMarkers.push(marker);
                markerMap[item.id] = marker; // 記錄對照表
            });

            renderInventory();
        }

        // LocationIQ Search API integration ("雷達範圍掃瞄")
        async function searchRestaurantsInBounds() {
            setDialogue("正在調動【雷達視角】發動範圍掃瞄，搜尋視野內的餐廳...");
            const bounds = map.getBounds();
            const south = bounds.getSouth();
            const west = bounds.getWest();
            const north = bounds.getNorth();
            const east = bounds.getEast();

            const viewbox = `${west},${north},${east},${south}`;

            try {
                const urlRest = `https://us1.locationiq.com/v1/search.php?key=${LOCATIONIQ_TOKEN}&q=restaurant&format=json&viewbox=${viewbox}&bounded=1&addressdetails=1`;
                const urlCafe = `https://us1.locationiq.com/v1/search.php?key=${LOCATIONIQ_TOKEN}&q=cafe&format=json&viewbox=${viewbox}&bounded=1&addressdetails=1`;

                const [resRest, resCafe] = await Promise.all([
                    fetch(urlRest),
                    fetch(urlCafe)
                ]);

                const dataRest = await resRest.json();
                const dataCafe = await resCafe.json();

                const combined = [
                    ...(Array.isArray(dataRest) ? dataRest : []),
                    ...(Array.isArray(dataCafe) ? dataCafe : [])
                ];

                if (combined.length > 0) {
                    parseLocationIQRestaurants(combined);
                } else {
                    setDialogue("此區域暫未掃瞄到新餐廳！試著移動地圖再掃瞄一次！");
                }
            } catch (e) {
                console.error(e);
                setDialogue("雷達掃瞄逾時！請稍後重試。");
            }
        }

        function parseLocationIQRestaurants(elements) {
            let addedCount = 0;
            elements.forEach((el, index) => {
                const lat = parseFloat(el.lat);
                const lon = parseFloat(el.lon);
                if (!lat || !lon) return;

                const name = el.display_name ? el.display_name.split(',')[0] : `動漫餐館 #${index + 1}`;
                if (allRestaurants.some(r => r.name === name)) return;

                const address = (el.address && (el.address.road || el.address.neighbourhood))
                    ? `${el.address.neighbourhood || ''} ${el.address.road || ''}`.trim()
                    : (el.display_name || '香港街頭');

                const restaurant = {
                    id: 'liq_' + (el.place_id || Math.random()),
                    name: name,
                    lat: lat,
                    lon: lon,
                    status: 'uncategorized', // 預設歸類為「未分類」
                    address: address,
                    rating: (4.2 + Math.random() * 0.7).toFixed(1)
                };

                allRestaurants.push(restaurant);
                addedCount++;
            });

            persistRestaurants();
            renderAllMarkersAndInventory();
            setDialogue(`雷達掃瞄成功！一共捕捉了 ${addedCount} 間餐廳，已自動加入【❓ 未分類】！`);
        }

        function renderInventory() {
            const listEl = document.getElementById('restaurantList');
            const filtered = allRestaurants.filter(r => {
                if (currentFilter === 'all') return true;
                return r.status === currentFilter;
            });

            document.getElementById('inventoryCount').innerText = `${filtered.length} 筆`;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 text-slate-500 font-sans text-xs font-bold">目前沒有符合「${getStatusLabel(currentFilter)}」的據點</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(r => {
                const safeName = r.name.replace(/'/g, "\\'");
                return `
                <div class="anime-panel bg-white p-3 hover:border-rose-500 transition-all border-2 border-black relative">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-2.5">
                            <span class="text-2xl">${getStatusIcon(r.status)}</span>
                            <div>
                                <h3 class="font-bold text-sm text-slate-900 font-anime">
                                    ${r.name}
                                </h3>
                                <p class="text-[11px] text-slate-600 font-sans font-medium">🌟 戰鬥力 ${r.rating} | ${r.address}</p>
                            </div>
                        </div>
                        <button onclick="deleteRestaurant('${r.id}')" class="text-xs bg-rose-100 text-rose-700 px-1.5 py-0.5 border border-black hover:bg-rose-200 rounded">🗑️</button>
                    </div>
                    
                    <div class="mt-2.5 pt-2 border-t border-slate-200 flex flex-wrap items-center justify-between gap-1 text-xs">
                        <!-- 隨時切換分類按鈕 (未分類 / 食過 / 想去 / 最愛) -->
                        <div class="flex flex-wrap gap-1 font-sans text-[10px]">
                            <button onclick="updateRestaurantStatus('${r.id}', 'uncategorized')" class="px-2 py-0.5 border border-black rounded ${r.status === 'uncategorized' ? 'bg-purple-600 text-white font-bold' : 'bg-slate-100 text-slate-700'}">❓ 未分類</button>
                            <button onclick="updateRestaurantStatus('${r.id}', 'eaten')" class="px-2 py-0.5 border border-black rounded ${r.status === 'eaten' ? 'bg-rose-500 text-white font-bold' : 'bg-slate-100 text-slate-700'}">😋 食過</button>
                            <button onclick="updateRestaurantStatus('${r.id}', 'wishlist')" class="px-2 py-0.5 border border-black rounded ${r.status === 'wishlist' ? 'bg-amber-400 text-black font-bold' : 'bg-slate-100 text-slate-700'}">📌 想去</button>
                            <button onclick="updateRestaurantStatus('${r.id}', 'favorite')" class="px-2 py-0.5 border border-black rounded ${r.status === 'favorite' ? 'bg-pink-500 text-white font-bold' : 'bg-slate-100 text-slate-700'}">💖 最愛</button>
                        </div>

                        <div class="space-x-1 mt-1 sm:mt-0">
                            <button onclick="panToRestaurant('${r.id}', ${r.lat}, ${r.lon})" class="anime-btn bg-amber-300 text-black px-2 py-0.5 text-[10px] font-black">👁️ 檢視</button>
                            <a href="https://www.openrice.com/zh/hongkong/restaurants?what=${encodeURIComponent(r.name.split(' ')[0])}" target="_blank" class="anime-btn bg-orange-400 text-white px-2 py-0.5 text-[10px] font-black inline-block">📖 OpenRice</a>
                            <button onclick="startNavigation(${r.lat}, ${r.lon}, '${safeName}')" class="anime-btn bg-emerald-500 text-white px-2 py-0.5 text-[10px] font-black inline-block">🚀 導航</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-amber-300', 'text-black', 'font-black');
                btn.classList.add('bg-slate-100', 'text-slate-800');
            });
            event.target.classList.remove('bg-slate-100', 'text-slate-800');
            event.target.classList.add('bg-amber-300', 'text-black', 'font-black');
            renderInventory();
        }

        // 按下「檢視」時平移地圖，並自動打開餐廳 Popup 視窗
        function panToRestaurant(id, lat, lon) {
            map.setView([lat, lon], 19);
            if (markerMap[id]) {
                markerMap[id].openPopup();
            }
        }

        // 🚶‍♂️ 即時 OSRM 步行導航（不跳轉外部網頁）
        function startNavigation(destLat, destLng, targetName) {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }

            setDialogue(`正在生成前往「${targetName}」的步行戰隊出擊路線...`);

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userLat, userLng),
                    L.latLng(destLat, destLng)
                ],
                // 確保使用步行專用 (foot) OSRM API 服務路徑
                router: L.Routing.osrmv1({
                    serviceUrl: 'https://router.project-osrm.org/route/v1',
                    profile: 'foot' // 嚴格指定步行 Profile
                }),
                lineOptions: {
                    styles: [
                        { color: '#000000', opacity: 0.9, weight: 8 },
                        { color: '#f43f5e', opacity: 0.9, weight: 5 }
                    ]
                },
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                show: false,
                createMarker: function() { return null; } // 隱藏多餘預設標記
            }).addTo(map);

            // 監聽計算完成事件
            routingControl.on('routesfound', function(e) {
                const routes = e.routes;
                const summary = routes[0].summary;

                const distanceMeters = Math.round(summary.totalDistance);
                const distanceStr = distanceMeters >= 1000 ? (distanceMeters / 1000).toFixed(1) + ' 公里' : distanceMeters + ' 公尺';
                const timeMinutes = Math.max(1, Math.round(summary.totalTime / 60));

                document.getElementById('navTargetName').innerText = targetName;
                document.getElementById('navDistance').innerText = distanceStr;
                document.getElementById('navTime').innerText = timeMinutes + ' 分鐘';

                // 指引細節
                const instructionsContainer = document.getElementById('navInstructions');
                instructionsContainer.innerHTML = '';
                if (routes[0].instructions && routes[0].instructions.length > 0) {
                    routes[0].instructions.forEach((step, idx) => {
                        const stepEl = document.createElement('div');
                        stepEl.className = 'flex justify-between items-center py-1 border-b border-slate-200';
                        stepEl.innerHTML = `<span>${idx + 1}. ${step.text}</span> <span class="font-bold text-slate-500">${Math.round(step.distance)}m</span>`;
                        instructionsContainer.appendChild(stepEl);
                    });
                } else {
                    instructionsContainer.innerHTML = '<p class="text-slate-500">直行即可抵達目的地</p>';
                }

                document.getElementById('navPanel').classList.remove('hidden');
                setDialogue(`路線鎖定！距離 ${distanceStr}，預 ${timeMinutes} 分鐘！`);
            });

            routingControl.on('routingerror', function(err) {
                console.error("導航計算失敗：", err);
                setDialogue("無法取得路徑，請確認網路連線或座標位置！");
            });
        }

        // 結束導航並清除圖層
        function stopNavigation() {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            document.getElementById('navPanel').classList.add('hidden');
            setDialogue("已結束導航，恢復視野巡邏。");
        }

        function setDialogue(text) {
            document.getElementById('dialogueText').innerText = text;
        }

        window.onload = initMap;
    </script>
</body>
</html>
